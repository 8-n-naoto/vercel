name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Dummy, non-secret values so that the build and unit tests can load config. No network access is performed.
      APP_ENV: local
      SUPABASE_URL: https://ci-dummy.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ci-dummy-publishable-key-0000000
      SUPABASE_SECRET_KEY: ci-dummy-secret-key-00000000000
      DATABASE_URL: postgres://ci:ci@localhost:6543/postgres
      APP_ORIGIN: http://localhost:3000
      CONTENT_ORIGIN: http://127.0.0.1:3000
      CRON_SECRET: ci-dummy-cron-secret-0000000000000000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run audit
